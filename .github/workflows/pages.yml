# Testet bei jedem Push und veröffentlicht den Ordner site/ über GitHub Pages.
# Einmalig nötig: Repository → Settings → Pages → Source: "GitHub Actions".
name: Test und Veröffentlichung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests (Import, Steuerlogik, Konten (geparkt), Ablauf, Hilfeseiten, Freischaltung, Film)
        run: node --test tests/parse.test.js tests/tax.test.js tests/auth.test.js tests/wizard.test.js tests/help.test.js tests/gate.test.js tests/media.test.js
      - name: Syntaxprüfung der Skripte
        run: for f in site/*.js parked/accounts/*.js; do node --check "$f"; done

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
